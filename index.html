<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistem e-Kehadiran Guru</title>
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 15px; }
    h2 { color: #0d6efd; margin-top: 0; text-align: center; }
    
    /* Layout Utama */
    .main-layout { display: flex; flex-wrap: wrap; gap: 15px; max-width: 1000px; margin: 0 auto; }
    .left-panel { flex: 2; min-width: 320px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
    .right-panel { flex: 1; min-width: 260px; display: flex; flex-direction: column; gap: 15px; }
    
    /* Papan Kamera */
    .video-wrapper { position: relative; width: 100%; height: 320px; margin: 10px auto; background: #000; border-radius: 10px; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: cover; display: block; }
    canvas { position: absolute; top: 0; left: 0; }
    
    /* Kotak Mesej Status */
    .status-box { margin-top: 15px; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 14px; background: #e9ecef; color: #333; line-height: 1.4; }
    .status-tepat { background: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; }
    .status-lewat { background: #f8d7da; color: #842029; border: 1px solid #f5c2c7; font-size: 15px; }
    .status-pulang { background: #cff4fc; color: #055160; border: 1px solid #b6effb; }
    .status-warning { background: #fff3cd; color: #664d03; }
    
    /* Kad Statistik & Peringatan */
    .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    .card h3 { margin-top: 0; font-size: 16px; color: #333; border-bottom: 2px solid #f0f2f5; padding-bottom: 8px; }
    .stat-row { display: flex; justify-content: space-between; margin: 8px 0; font-size: 15px; }
    .stat-val { font-weight: bold; color: #0d6efd; }
    
    /* Senarai Nama */
    .alert-box { max-width: 1000px; margin: 15px auto 0; }
    .badge-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .badge { background: #e9ecef; padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; color: #495057; }
    .badge-danger { background: #f8d7da; color: #842029; }
    .badge-warning { background: #fff3cd; color: #664d03; }
  </style>
</head>
<body>

<!-- Peringatan Atas: Belum Masuk (Muncul Selepas 7:45 AM) -->
<div id="boxBelumMasuk" class="alert-box card" style="display: none; margin-bottom: 15px;">
  <h3 style="color: #842029;">⚠️ Senarai Guru Belum Daftar Masuk Hari Ini:</h3>
  <div id="listBelumMasuk" class="badge-list"></div>
</div>

<div class="main-layout">
  <!-- Bahagian Utama (Kamera & Status) -->
  <div class="left-panel">
    <h2>SISTEM KEHADIRAN GURU</h2>
    <p style="margin-top: -10px; color: #666; font-size: 13px;">Sila lihat pada kamera untuk imbasan kehadiran</p>

    <div class="video-wrapper" id="videoWrapper">
      <video id="video" autoplay playsinline muted></video>
    </div>

    <div id="statusBox" class="status-box">⏳ Memulakan Kamera...</div>
  </div>

  <!-- Bahagian Kanan (Statistik Ringkas) -->
  <div class="right-panel">
    <div class="card">
      <h3>📊 Ringkasan Kehadiran Hari Ini</h3>
      <div class="stat-row">
        <span>Jumlah Guru:</span>
        <span id="statTotal" class="stat-val">0</span>
      </div>
      <div class="stat-row">
        <span>Telah Daftar Masuk:</span>
        <span id="statHadir" class="stat-val" style="color: #198754;">0</span>
      </div>
      <div class="stat-row">
        <span>Telah Daftar Pulang:</span>
        <span id="statPulang" class="stat-val" style="color: #0dcaf0;">0</span>
      </div>
    </div>
  </div>
</div>

<!-- Peringatan Bawah: Tidak Daftar Pulang Semalam -->
<div id="boxTidakPulang" class="alert-box card" style="display: none;">
  <h3 style="color: #664d03;">⚠️ Rekod Semalam: Guru Tidak Daftar Pulang:</h3>
  <div id="listTidakPulang" class="badge-list"></div>
</div>

<script>
  // TAMPAL URL WEB APP APPS SCRIPT CIKGU DI SINI:
  const API_URL = "https://script.google.com/macros/s/AKfycbwao0yfSrJFywf7ijo7eq_-2LC9_8E7QfklaYAPa7wwIsN8YGb1aQFEqpoDQWZjWgpI/exec";

  const video = document.getElementById('video');
  const statusBox = document.getElementById('statusBox');
  
  let labeledDescriptors = [];
  let faceMatcher = null;
  let isProcessing = false;

  const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model';

  window.onload = () => {
    initCamera();
  };

  async function initCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      video.srcObject = stream;
      video.onloadedmetadata = () => {
        video.play();
        updateStatus("Kamera Aktif! Memuatkan Model AI...", "warning");
        loadModels();
      };
    } catch (err) {
      updateStatus("❌ Kamera disekat atau tidak ditemui.", "error");
    }
  }

  async function loadModels() {
    try {
      await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
      await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
      await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
      
      updateStatus("⏳ Memuatkan data lengkap dari Google Sheet...", "warning");
      fetchTeacherData();
    } catch (e) {
      updateStatus("❌ Gagal memuatkan enjin AI.", "error");
    }
  }

  async function fetchTeacherData() {
    try {
      const res = await fetch(API_URL + "?action=getDataLengkap");
      const data = await res.json();

      // Update Statistik Kanan
      if (data.statistik) {
        document.getElementById('statTotal').innerText = data.statistik.jumlahGuru || 0;
        document.getElementById('statHadir').innerText = data.statistik.hadir || 0;
        document.getElementById('statPulang').innerText = data.statistik.pulang || 0;
      }

      // Update Senarai Belum Masuk (Paparkan jika jam > 7:45 AM)
      const now = new Date();
      const currentMinit = (now.getHours() * 60) + now.getMinutes();
      if (currentMinit > (7 * 60 + 45) && data.belumMasuk && data.belumMasuk.length > 0) {
        document.getElementById('boxBelumMasuk').style.display = 'block';
        document.getElementById('listBelumMasuk').innerHTML = data.belumMasuk.map(n => `<span class="badge badge-danger">${n}</span>`).join('');
      } else {
        document.getElementById('boxBelumMasuk').style.display = 'none';
      }

      // Update Senarai Tidak Pulang Semalam (Bawah)
      if (data.tidakPulangSemalam && data.tidakPulangSemalam.length > 0) {
        document.getElementById('boxTidakPulang').style.display = 'block';
        document.getElementById('listTidakPulang').innerHTML = data.tidakPulangSemalam.map(n => `<span class="badge badge-warning">${n}</span>`).join('');
      } else {
        document.getElementById('boxTidakPulang').style.display = 'none';
      }

      // BINA DESCRIPTOR AI
      if (!data.senaraiGuru || data.senaraiGuru.length === 0) {
        updateStatus("⚠️ Tiada data guru ditemui!", "warning");
        return;
      }

      labeledDescriptors = [];
      for (let guru of data.senaraiGuru) {
        if (guru.urlGambar) {
          try {
            const img = await faceapi.fetchImage(guru.urlGambar);
            const detections = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
            if (detections) {
              labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(guru.id + "___" + guru.nama, [detections.descriptor]));
            }
          } catch (e) {}
        }
      }

      if (labeledDescriptors.length > 0) {
        faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.6);
        updateStatus("Sistem Sedia! Sila lihat pada kamera.", "normal");
        startDetection();
      } else {
        updateStatus("⚠️ Gambar guru gagal diproses.", "error");
      }
    } catch (err) {
      updateStatus("❌ Gagal sambungan ke Google Sheet.", "error");
    }
  }

  function startDetection() {
    const wrapper = document.getElementById('videoWrapper');
    const oldCanvas = wrapper.querySelector('canvas');
    if (oldCanvas) oldCanvas.remove();

    const canvas = faceapi.createCanvasFromMedia(video);
    wrapper.append(canvas);

    setInterval(async () => {
      if (isProcessing || !faceMatcher || video.paused || video.ended) return;

      const displaySize = { width: video.clientWidth, height: video.clientHeight };
      faceapi.matchDimensions(canvas, displaySize);

      const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 })).withFaceLandmarks().withFaceDescriptors();
      const resizedDetections = faceapi.resizeResults(detections, displaySize);
      
      canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
      faceapi.draw.drawDetections(canvas, resizedDetections);

      if (resizedDetections.length > 0) {
        const results = resizedDetections.map(d => faceMatcher.findBestMatch(d.descriptor));
        results.forEach(async result => {
          if (result.label !== 'unknown' && !isProcessing) {
            isProcessing = true;
            const parts = result.label.split('___');
            const guruId = parts[0];
            const guruNama = parts[1];

            updateStatus("Muka Dikesan: " + guruNama + ". Merakam...", "warning");

            try {
              const resp = await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ id: guruId, nama: guruNama })
              });
              const res = await resp.json();

              if (res.type === "MASUK_TEPAT") updateStatus("☀️ " + res.msg, "tepat");
              else if (res.type === "MASUK_LEWAT") updateStatus("⚠️ " + res.msg, "lewat");
              else if (res.type === "PULANG") updateStatus("🏢 " + res.msg, "pulang");
              else updateStatus(res.msg, "warning");

              // Kemaskini statistik selepas imbasan berjaya
              fetchTeacherData();
            } catch (e) {
              updateStatus("❌ Gagal menyimpan rekod.", "error");
            }

            setTimeout(() => {
              isProcessing = false;
              updateStatus("Sistem Sedia! Sila lihat pada kamera.", "normal");
            }, 5000);
          }
        });
      }
    }, 800);
  }

  function updateStatus(msg, type) {
    statusBox.innerText = msg;
    statusBox.className = "status-box";
    if (type === "tepat") statusBox.classList.add("status-tepat");
    else if (type === "lewat") statusBox.classList.add("status-lewat");
    else if (type === "pulang") statusBox.classList.add("status-pulang");
    else if (type === "warning") statusBox.classList.add("status-warning");
  }
</script>

</body>
</html>
